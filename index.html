<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ders Arası</title>
    <style>
        :root {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --card-bg: #1e1e1e;
            --accent-color: #bb86fc;
            --hover-color: #3700b3;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 3rem 1rem 2rem;
        }

        header h1 {
            margin: 0;
            font-size: 2.5rem;
            color: var(--accent-color);
            letter-spacing: 2px;
        }

        header p {
            color: #888;
            font-size: 1.1rem;
            margin-top: 0.5rem;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            width: 90%;
            max-width: 1000px;
            padding: 2rem 0;
            flex: 1;
        }

        .game-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 2rem;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            border: 1px solid #333;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            border-color: var(--accent-color);
        }

        .game-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .game-title {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: var(--accent-color);
            font-weight: bold;
        }

        .game-desc {
            font-size: 0.9rem;
            color: #aaa;
            line-height: 1.4;
        }

        footer {
            margin-top: auto;
            padding: 2rem;
            color: #555;
            font-size: 0.9rem;
            text-align: center;
            width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <h1>Ders Arası</h1>
        <p>Derste Oynamalık Oyunlar</p>
    </header>

    <div class="game-grid" id="gameGrid">
        <!-- Oyun 1 -->
        <a href="sayi-bulmaca.html" class="game-card">
            <div class="game-icon">🔢</div>
            <div class="game-title">Sayı Bulmaca</div>
            <div class="game-desc">Aklından tuttuğu 3 basamaklı sayıyı mantıkla çöz.</div>
        </a>
        
        <!-- Oyun 2 -->
        <a href="21-oyunu.html" class="game-card">
            <div class="game-icon">🃏</div>
            <div class="game-title">21 (Blackjack)</div>
            <div class="game-desc">İflas etmeden 5000 TL hedefine ulaşabilecek misin?</div>
        </a>

        <!-- Gelecek Oyunlar İçin Yer Tutucu -->
        <a href="#" class="game-card" style="opacity: 0.5; cursor: default;">
            <div class="game-icon">🔒</div>
            <div class="game-title">Oyun 3</div>
            <div class="game-desc">Çok yakında...</div>
        </a>
    </div>

    <footer>
        &copy; 2026 - Sessizce oyna.
    </footer>

</body>
</html>
